<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>任务中心</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e9edf2;
        --muted: color-mix(in oklab, #e9edf2 55%, transparent);
        --faint: color-mix(in oklab, #e9edf2 34%, transparent);
        --surface: color-mix(in oklab, #ffffff 4%, transparent);
        --surface-hover: color-mix(in oklab, #ffffff 8%, transparent);
        --border: color-mix(in oklab, #ffffff 11%, transparent);
        --accent: #5b9dff;
        --done: #4ec08d;
        --danger: #e2685c;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --fg: #1a1c1f;
        --muted: color-mix(in oklab, #1a1c1f 58%, transparent);
        --faint: color-mix(in oklab, #1a1c1f 38%, transparent);
        --surface: color-mix(in oklab, #1a1c1f 4%, transparent);
        --surface-hover: color-mix(in oklab, #1a1c1f 7%, transparent);
        --border: color-mix(in oklab, #1a1c1f 12%, transparent);
        --accent: #2f6fd0;
        --done: #1f8f5f;
        --danger: #b8443a;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      /*
       * 这是工作面板视图（views），不是独立面板：宿主把 titlebar 高度发布为
       * 0px（面板才占 46px 拖拽带），回退值必须也是 0px，否则变量缺失时会
       * 凭空多出一条 46px 的空白。视图里也没有窗口控制胶囊。
       */
      body {
        margin: 0;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        padding: var(--pi-plugin-titlebar-height, 0px) 0 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: transparent;
        color: var(--fg);
        overflow: hidden;
      }

      .head {
        flex: none;
        padding: 12px 16px 10px;
        border-bottom: 1px solid var(--border);
      }

      .head-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .head h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .head .count {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .detail, .notice { margin-top: 6px; color: var(--muted); font-size: 12px; }
      .notice { color: var(--danger); overflow-wrap: anywhere; }

      .bar {
        margin-top: 8px;
        height: 4px;
        border-radius: 2px;
        background: var(--surface);
        overflow: hidden;
      }

      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--done);
        transition: width 240ms ease;
      }

      .current {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .current .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }

      .current .text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 10px 12px 20px;
      }

      ul.list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      li.item {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 8px;
        align-items: start;
        padding: 7px 9px;
        border-radius: 7px;
        border: 1px solid transparent;
        transition: background 120ms ease;
      }

      li.item:hover { background: var(--surface-hover); }

      li.item.active {
        border-color: color-mix(in oklab, var(--accent) 45%, transparent);
        background: color-mix(in oklab, var(--accent) 10%, transparent);
      }

      .glyph {
        width: 16px;
        height: 16px;
        margin-top: 1px;
        border-radius: 50%;
        border: 1.5px solid var(--faint);
        display: grid;
        place-items: center;
        font-size: 10px;
        line-height: 1;
        color: transparent;
      }

      li.item[data-status="in_progress"] .glyph {
        border-color: var(--accent);
        border-style: dashed;
        animation: spin 6s linear infinite;
      }

      li.item[data-status="completed"] .glyph {
        border-color: var(--done);
        background: var(--done);
        color: #fff;
      }

      li.item[data-status="cancelled"] .glyph {
        border-color: var(--faint);
        color: var(--faint);
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        li.item[data-status="in_progress"] .glyph { animation: none; }
      }

      .content {
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      li.item[data-status="completed"] .content {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--faint);
      }

      li.item[data-status="cancelled"] .content {
        color: var(--faint);
        text-decoration: line-through;
        text-decoration-color: var(--faint);
      }

      .prio {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
        letter-spacing: 0.04em;
      }

      .prio[data-p="high"] { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 42%, transparent); }
      .prio[data-p="low"] { color: var(--faint); }

      .empty {
        margin: 28px 16px;
        text-align: center;
        color: var(--muted);
      }

      .empty p { margin: 0 0 6px; }
      .empty .hint { color: var(--faint); font-size: 12px; }

      .foot {
        flex: none;
        padding: 7px 16px;
        border-top: 1px solid var(--border);
        color: var(--faint);
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .legend { display: flex; gap: 10px; }
      .legend span { display: inline-flex; align-items: center; gap: 4px; }
      .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
      .legend i.p { background: var(--faint); }
      .legend i.a { background: var(--accent); }
      .legend i.d { background: var(--done); }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="head-row">
        <h1 id="title">任务中心</h1>
        <span class="count" id="count">—</span>
      </div>
      <div class="bar" id="progressBar" role="progressbar" aria-label="已结束任务" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress"></i></div>
      <div class="detail" id="breakdown" hidden></div>
      <div class="notice" id="notice" role="status" aria-live="polite">正在加载…</div>
      <div class="current" id="currentRow" hidden>
        <span class="dot"></span>
        <span class="text" id="currentText"></span>
      </div>
    </div>

    <div class="scroll">
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden>
        <p id="emptyTitle">还没有任务清单</p>
        <p class="hint" id="emptyHint">让 Agent 开始一个多步任务，它会用 todo_write 建清单</p>
      </div>
    </div>

    <div class="foot">
      <span class="legend">
        <span><i class="p"></i><span id="legendPending">待办</span></span>
        <span><i class="a"></i><span id="legendActive">进行中</span></span>
        <span><i class="d"></i><span id="legendDone">已完成</span></span>
      </span>
      <span id="updated">—</span>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
