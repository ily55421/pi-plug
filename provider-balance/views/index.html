<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>供应商余额看板</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e9edf2;
        --muted: color-mix(in oklab, #e9edf2 55%, transparent);
        --faint: color-mix(in oklab, #e9edf2 34%, transparent);
        --surface: color-mix(in oklab, #ffffff 4%, transparent);
        --surface-hover: color-mix(in oklab, #ffffff 8%, transparent);
        --border: color-mix(in oklab, #ffffff 11%, transparent);
        --accent: #5b9dff;
        --ok: #4ec08d;
        --warn: #e0a95c;
        --danger: #e2685c;
        --track: color-mix(in oklab, #ffffff 9%, transparent);
      }
      :root[data-base="light"] {
        color-scheme: light;
        --fg: #1a1c1f;
        --muted: color-mix(in oklab, #1a1c1f 58%, transparent);
        --faint: color-mix(in oklab, #1a1c1f 38%, transparent);
        --surface: color-mix(in oklab, #1a1c1f 4%, transparent);
        --surface-hover: color-mix(in oklab, #1a1c1f 7%, transparent);
        --border: color-mix(in oklab, #1a1c1f 12%, transparent);
        --accent: #2f6fd0;
        --ok: #1f8f5f;
        --warn: #9a6b1f;
        --danger: #b8443a;
        --track: color-mix(in oklab, #1a1c1f 9%, transparent);
      }

      * { box-sizing: border-box; }

      /*
       * 这是工作面板视图（views），不是独立面板：宿主把 titlebar 高度发布为
       * 0px（面板才占 46px 拖拽带），回退值必须也是 0px，否则变量缺失时会
       * 凭空多出一条 46px 的空白。视图里也没有窗口控制胶囊。
       */
      body {
        margin: 0;
        min-height: 100vh;
        padding: var(--pi-plugin-titlebar-height, 0px) 0 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: transparent;
        color: var(--fg);
        overflow: hidden;
      }

      .head {
        flex: none;
        padding: 12px 16px 10px;
        border-bottom: 1px solid var(--border);
      }
      .head-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .head h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .head .count {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .spacer { flex: 1; }

      button {
        font: inherit;
        color: var(--fg);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 9px;
        cursor: pointer;
        transition: background 120ms ease;
      }
      button:hover:not(:disabled) { background: var(--surface-hover); }
      button:disabled { opacity: 0.5; cursor: default; }

      .scroll {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px 14px;
      }

      .grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        padding: 10px 12px;
      }
      .card-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .card-name {
        font-weight: 600;
        font-size: 13px;
      }
      .card-status {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .card-status.bad { color: var(--danger); }
      .card-status.good { color: var(--ok); }

      /* 余额指标：金额数字用等宽数位，避免刷新时跳动 */
      .metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-top: 7px;
      }
      .metric {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .metric-label { color: var(--muted); font-size: 11px; }
      .metric-value {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        font-weight: 600;
      }
      .metric-value.money { font-size: 14px; }
      .metric-unit { color: var(--faint); font-size: 11px; }

      /* 配额条 */
      .quota { margin-top: 8px; }
      .quota-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 11px;
      }
      .quota-group { color: var(--fg); }
      .quota-label { color: var(--muted); }
      .quota-reset { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
      .track {
        margin-top: 3px;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 200ms ease;
      }
      .fill.warn { background: var(--warn); }
      .fill.danger { background: var(--danger); }
      .quota-foot {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .empty {
        padding: 26px 16px;
        text-align: center;
        color: var(--muted);
      }
      .empty p { margin: 0 0 6px; }
      .empty .hint { color: var(--faint); font-size: 12px; }

      /* 「本机另有 N 个供应商不在此看板内」的说明块 */
      .unsupported {
        margin-top: 10px;
        padding: 9px 12px;
        border: 1px dashed var(--border);
        border-radius: 8px;
      }
      .unsupported .u-title {
        margin: 0 0 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .unsupported .u-hint {
        margin: 0;
        font-size: 11px;
        color: var(--faint);
        word-break: break-word;
      }

      .foot {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--faint);
      }
      .foot .note { color: var(--muted); }
      .foot .spacer { flex: 1; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="head-row">
        <h1>供应商余额</h1>
        <span class="count" id="count">—</span>
        <span class="spacer"></span>
        <button id="refresh" type="button">刷新</button>
      </div>
    </div>

    <div class="scroll">
      <div class="grid" id="grid"></div>
      <div class="unsupported" id="unsupported" hidden>
        <p class="u-title">本机另有 <span id="uCount">0</span> 个供应商不在此看板内</p>
        <p class="u-hint" id="uList"></p>
        <p class="u-hint">这些供应商没有公开的余额/配额接口（多为聚合网关或自建端点），插件无法查询。</p>
      </div>
      <div class="empty" id="empty" hidden>
        <p>还没有查询过</p>
        <p class="hint">点右上角「刷新」查询本机已登录供应商的余额与配额</p>
      </div>
    </div>

    <div class="foot">
      <span class="note" id="note">—</span>
      <span class="spacer"></span>
      <span id="updated">—</span>
    </div>

    <script>
      /*
       * 视图页没有 `pi` 对象，只有 window.pluginBridge。
       *
       * 面板桥只放行固定通道，没有「查余额」这种通道，所以查询走插件自定义
       * 通道（宿主把不认识的通道转发到插件进程的 onPanelInvoke）——这是
       * local.trajectory 已验证的范式，比把大 JSON 写进设置再轮询便宜。
       *
       * 本页只读：从不写设置、不发网络请求（网络只在插件进程里、经宿主
       * pi.net.fetch 发出）。所有文本用 textContent 写入，不做 HTML 解析。
       */
      (function () {
        "use strict";

        const bridge = window.pluginBridge || null;

        /** 面板可见时 1.5s 复查一次缓存；隐藏时 8s。 */
        const POLL_MS = 1500;
        const POLL_HIDDEN_MS = 8000;
        /** 主题变化的复查节奏。工作面板视图收不到 appearance:changed 推送。 */
        const APPEARANCE_POLL_MS = 5000;

        const $ = (id) => document.getElementById(id);

        const state = {
          snapshot: null,
          ttlMs: 5 * 60 * 1000,
          busy: false,
          renderKey: null,
          timer: null,
          appearanceTimer: null,
        };

        /* ------------------------------------------------------------ 外观 */

        function applyAppearance(appearance) {
          const base = appearance && appearance.base;
          const resolved =
            base === "light" || base === "dark"
              ? base
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          if (document.documentElement.dataset.base !== resolved) {
            document.documentElement.dataset.base = resolved;
          }
        }

        async function pollAppearance() {
          if (!bridge) return;
          try {
            const res = await bridge.invoke("balance.appearance", {});
            if (res && res.ok) applyAppearance(res);
          } catch {
            /* 拿不到就沿用系统偏好 */
          }
        }

        /* ------------------------------------------------------------ 格式化 */

        function stamp(ms) {
          const n = Number(ms);
          if (!Number.isFinite(n) || n <= 0) return "—";
          const d = new Date(n);
          if (Number.isNaN(d.getTime())) return "—";
          const hh = String(d.getHours()).padStart(2, "0");
          const mm = String(d.getMinutes()).padStart(2, "0");
          return d.getMonth() + 1 + "月" + d.getDate() + "日 " + hh + ":" + mm;
        }

        /** 剩余重置时间，做成「2 小时 15 分后」这种人读形式。 */
        function until(seconds) {
          const n = Number(seconds);
          if (!Number.isFinite(n) || n <= 0) return "";
          const diff = n * 1000 - Date.now();
          if (diff <= 0) return "即将重置";
          const mins = Math.round(diff / 60000);
          if (mins < 60) return mins + " 分钟后重置";
          const hours = Math.floor(mins / 60);
          if (hours < 24) return hours + " 小时 " + (mins % 60) + " 分后重置";
          return Math.floor(hours / 24) + " 天后重置";
        }

        /** 金额按币种给符号；数值本身保留原始字符串精度。 */
        function money(value, currency) {
          const symbol = currency === "CNY" ? "¥" : currency === "USD" ? "$" : "";
          const raw = typeof value === "string" ? value : String(value);
          return symbol ? symbol + raw : raw;
        }

        function statusText(item) {
          switch (item.status) {
            case "ready":
              return { text: "已查询", cls: "good" };
            case "no-credential":
              return { text: "未登录", cls: "" };
            case "custom-origin":
              return { text: "自定义域名，已跳过", cls: "bad" };
            case "query-failed":
              return {
                text: item.httpStatus ? "HTTP " + item.httpStatus + (item.retryAfter ? "（" + item.retryAfter + " 后重试）" : "") : "查询失败",
                cls: "bad",
              };
            case "empty":
              return { text: "响应无可用数据", cls: "bad" };
            default:
              return { text: "不支持", cls: "" };
          }
        }

        /** 用了多少 → 配色：>=90% 红，>=70% 黄，其余蓝。 */
        function fillClass(usedPercent) {
          if (!Number.isFinite(usedPercent)) return "";
          if (usedPercent >= 90) return "danger";
          if (usedPercent >= 70) return "warn";
          return "";
        }

        /* -------------------------------------------------------------- 渲染 */

        function renderMetric(metric) {
          const row = document.createElement("div");
          row.className = "metric";

          const label = document.createElement("span");
          label.className = "metric-label";
          label.textContent = metric.label;
          row.appendChild(label);

          const value = document.createElement("span");
          const isMoney = metric.unit === "currency";
          value.className = "metric-value" + (isMoney ? " money" : "");
          if (isMoney) {
            value.textContent = money(metric.value, metric.currency);
          } else {
            value.textContent = typeof metric.value === "number" ? String(metric.value) : String(metric.value);
          }
          row.appendChild(value);

          if (!isMoney && metric.unit === "count") {
            const unit = document.createElement("span");
            unit.className = "metric-unit";
            unit.textContent = "credits";
            row.appendChild(unit);
          }
          return row;
        }

        function renderBucket(bucket) {
          const wrap = document.createElement("div");
          wrap.className = "quota";

          const head = document.createElement("div");
          head.className = "quota-head";
          if (bucket.groupLabel) {
            const group = document.createElement("span");
            group.className = "quota-group";
            group.textContent = bucket.groupLabel;
            head.appendChild(group);
          }
          const label = document.createElement("span");
          label.className = "quota-label";
          label.textContent = bucket.label;
          head.appendChild(label);

          const reset = document.createElement("span");
          reset.className = "quota-reset";
          reset.textContent = bucket.resetsAt ? until(bucket.resetsAt) : "";
          head.appendChild(reset);
          wrap.appendChild(head);

          // 用量百分比：优先 used/limit，没有则从 remaining 反推。
          let usedPercent = NaN;
          const used = Number(bucket.used);
          const limit = Number(bucket.limit);
          const remaining = Number(bucket.remaining);
          if (Number.isFinite(used) && Number.isFinite(limit) && limit > 0) usedPercent = (used / limit) * 100;
          else if (Number.isFinite(remaining) && Number.isFinite(limit) && limit > 0) usedPercent = 100 - (remaining / limit) * 100;
          else if (Number.isFinite(remaining)) usedPercent = 100 - remaining;

          const track = document.createElement("div");
          track.className = "track";
          const fill = document.createElement("i");
          fill.className = "fill " + fillClass(usedPercent);
          fill.style.width = Number.isFinite(usedPercent) ? Math.min(100, Math.max(0, usedPercent)).toFixed(1) + "%" : "0%";
          track.appendChild(fill);
          wrap.appendChild(track);

          // 数值行：单位是百分比就显示百分比，否则显示 剩余/总量。
          const foot = document.createElement("div");
          foot.className = "quota-foot";
          if (bucket.period === "Unlimited") {
            foot.textContent = "不限量";
          } else if (bucket.unit === "percent") {
            const r = Number(bucket.remaining);
            foot.textContent = Number.isFinite(r)
              ? "剩余 " + (Math.round(r * 10) / 10) + "%" + (Number.isFinite(usedPercent) ? " · 已用 " + (Math.round(usedPercent * 10) / 10) + "%" : "")
              : "";
          } else if (bucket.unit === "currency") {
            const parts = [];
            if (Number.isFinite(remaining)) parts.push("剩余 " + money(bucket.remaining, bucket.currency));
            if (Number.isFinite(limit)) parts.push("上限 " + money(bucket.limit, bucket.currency));
            foot.textContent = parts.join(" · ");
          } else {
            const parts = [];
            if (Number.isFinite(remaining)) parts.push("剩余 " + remaining);
            if (Number.isFinite(limit)) parts.push("总量 " + limit);
            foot.textContent = parts.join(" / ");
          }
          wrap.appendChild(foot);
          return wrap;
        }

        function renderCard(item) {
          const card = document.createElement("div");
          card.className = "card";

          const top = document.createElement("div");
          top.className = "card-top";

          const name = document.createElement("span");
          name.className = "card-name";
          name.textContent = item.providerName || item.providerId;
          top.appendChild(name);

          const status = document.createElement("span");
          const info = statusText(item);
          status.className = "card-status " + info.cls;
          status.textContent = info.text;
          if (item.status === "custom-origin" && item.baseUrl) status.title = "自定义 baseUrl：" + item.baseUrl;
          if (item.status === "query-failed" && item.message) status.title = item.message;
          top.appendChild(status);
          card.appendChild(top);

          const report = item.report;
          if (report && Array.isArray(report.metrics) && report.metrics.length) {
            const metrics = document.createElement("div");
            metrics.className = "metrics";
            report.metrics.forEach((metric) => metrics.appendChild(renderMetric(metric)));
            card.appendChild(metrics);
          }
          if (report && Array.isArray(report.buckets)) {
            report.buckets.forEach((bucket) => card.appendChild(renderBucket(bucket)));
          }
          return card;
        }

        function render() {
          const snapshot = state.snapshot;
          const results = snapshot && Array.isArray(snapshot.results) ? snapshot.results : [];

          // 渲染键：结果集合或状态变化才重排 DOM，避免 1.5s 轮询把滚动位置重置。
          const key = results
            .map((r) => r.providerId + ":" + r.status + ":" + (r.report ? JSON.stringify(r.report.buckets) + JSON.stringify(r.report.metrics) : ""))
            .join("|");
          if (key === state.renderKey) {
            updateFooter(results, snapshot);
            return;
          }
          state.renderKey = key;

          const grid = $("grid");
          grid.textContent = "";
          results.forEach((item) => grid.appendChild(renderCard(item)));

          $("empty").hidden = results.length > 0;
          renderUnsupported(snapshot);
          updateFooter(results, snapshot);
        }

        /**
         * 展示「本机配了、但不在支持列表」的供应商。
         *
         * 这一段解决的是可用性问题：本机常见的聚合网关（apigoto、longcat 等）
         * 没有公开的余额接口，只显示九行「未登录」会让用户以为插件坏了。
         */
        function renderUnsupported(snapshot) {
          const list = snapshot && Array.isArray(snapshot.unsupported) ? snapshot.unsupported : [];
          const box = $("unsupported");
          if (!list.length) {
            box.hidden = true;
            return;
          }
          $("uCount").textContent = String(list.length);
          $("uList").textContent = list.map((item) => item.id).join("、");
          box.hidden = false;
        }

        function updateFooter(results, snapshot) {
          const ready = results.filter((r) => r.status === "ready").length;
          $("count").textContent = results.length ? ready + "/" + results.length + " 已查询" : "—";

          if (!snapshot || !results.length) {
            $("note").textContent = "—";
            $("updated").textContent = "—";
            return;
          }
          const age = Date.now() - Number(snapshot.capturedAt || 0);
          const stale = age > state.ttlMs;
          $("note").textContent = stale ? "数据已超过 5 分钟" : "数据新鲜";
          $("updated").textContent = "更新于 " + stamp(snapshot.capturedAt);
        }

        /* -------------------------------------------------------------- 轮询 */

        async function loadCached() {
          if (!bridge) return;
          try {
            const res = await bridge.invoke("balance.cached", {});
            if (res && res.ok) {
              state.snapshot = res.snapshot;
              if (Number.isFinite(res.ttlMs)) state.ttlMs = res.ttlMs;
              render();
            }
          } catch {
            /* 读缓存失败不是错误 */
          }
        }

        async function refresh() {
          if (!bridge || state.busy) return;
          state.busy = true;
          const btn = $("refresh");
          btn.disabled = true;
          btn.textContent = "查询中…";
          try {
            const res = await bridge.invoke("balance.refresh", {});
            if (res && res.ok) {
              state.snapshot = res;
              state.renderKey = null; // 强制重排：这是用户主动发起的刷新
              render();
            }
          } catch {
            /* 失败时保留上一次结果 */
          } finally {
            state.busy = false;
            btn.disabled = false;
            btn.textContent = "刷新";
          }
        }

        function schedule() {
          if (state.timer) clearTimeout(state.timer);
          const ms = document.hidden ? POLL_HIDDEN_MS : POLL_MS;
          state.timer = setTimeout(tick, ms);
        }

        async function tick() {
          await loadCached();
          schedule();
        }

        /* -------------------------------------------------------------- 启动 */

        $("refresh").addEventListener("click", refresh);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) void loadCached();
          schedule();
        });

        if (!bridge) {
          $("note").textContent = "pluginBridge 不可用";
        } else {
          void pollAppearance();
          state.appearanceTimer = setInterval(pollAppearance, APPEARANCE_POLL_MS);
          void loadCached();
          schedule();
        }
      })();
    </script>
  </body>
</html>
